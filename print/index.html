  :root{
    --bg:#FFFFFF;
    --panel:#F5F5F3;
    --panel-2:#EBEBE7;
    --text:#161513;
    --text-soft:#726F68;
    --line:#DEDCD5;
    --cyan:#00AEEF;
    --magenta:#EC008C;
    --yellow:#F5C400;
    --ok:#2E9A50;
    --err:#D93025;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:420px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:120px;
  }
  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand-mark{display:flex; align-items:center; gap:12px;}
  .cmyk-dots{
    display:grid;
    grid-template-columns:repeat(2,9px);
    grid-template-rows:repeat(2,9px);
    gap:2px;
    flex-shrink:0;
  }
  .cmyk-dots span{border-radius:50%;}
  .cmyk-dots span:nth-child(1){background:var(--cyan);}
  .cmyk-dots span:nth-child(2){background:var(--magenta);}
  .cmyk-dots span:nth-child(3){background:var(--yellow);}
  .cmyk-dots span:nth-child(4){background:var(--text);}
  .brand-mark h1{
    font-family:'Archivo Black', sans-serif;
    font-size:16px;
    margin:0;
    letter-spacing:0.2px;
    line-height:1.15;
  }
  .brand-mark p{margin:2px 0 0; font-size:11px; color:var(--text-soft); letter-spacing:0.5px; text-transform:uppercase;}
  .ticket-no{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-soft);
    text-align:right;
  }
  .ticket-no b{display:block; color:var(--text); font-size:13px;}

  main{padding:20px;}
  .step{margin-bottom:26px;}
  .step-label{
    display:flex; align-items:baseline; gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.6px;
    margin-bottom:10px;
  }
  .step-label .n{color:var(--magenta); font-weight:600;}

  .drop{
    display:flex;
    align-items:center;
    gap:14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--panel);
    padding:18px 16px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .drop:active{background:var(--panel-2);}
  .drop.has-file{border-color:var(--ok);}
  .drop.bad-file{border-color:var(--err);}
  .drop .icon{
    width:44px; height:44px;
    border-radius:8px;
    background:var(--panel-2);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .drop .icon svg{width:22px; height:22px; stroke:var(--cyan);}
  .drop.has-file .icon svg{stroke:var(--ok);}
  .drop.bad-file .icon svg{stroke:var(--err);}
  .drop-text{min-width:0;}
  .drop-text p{margin:0; font-size:14px; color:var(--text); font-weight:500;}
  .drop-text p.file-name{color:var(--ok); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .drop-text p.file-bad{color:var(--err);}
  .drop-text span{font-size:11.5px; color:var(--text-soft);}
  input[type=file]{display:none;}

  .limit-note{
    font-size:11.5px; color:var(--text-soft); margin-top:8px; line-height:1.5;
  }
  .limit-note b{color:var(--text); font-weight:600;}

  .preview{
    display:none;
    margin-top:12px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--panel);
    padding:12px;
  }
  .preview.show{display:block;}
  .preview canvas{
    display:block;
    margin:0 auto;
    max-width:100%;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
  }
  .pv-bar{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:10px;
  }
  .pv-bar button{
    width:34px;height:34px;
    border-radius:6px;
    border:1.5px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-size:16px;
    cursor:pointer;
  }
  .pv-bar button:disabled{opacity:.35; cursor:default;}
  .pv-bar span{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--text-soft);
  }

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .choice{
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    padding:12px 10px;
    text-align:center;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    user-select:none;
    color:var(--text);
  }
  .choice.active{
    background:var(--text);
    color:#FFFFFF;
    border-color:var(--text);
  }
  .choice[data-val="color"].active{background:var(--magenta); border-color:var(--magenta); color:#fff;}
  .choice .sub{display:block; font-size:11px; font-weight:400; opacity:.7; margin-top:2px;}

  .stepper{
    display:flex; align-items:center; justify-content:space-between;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    background:var(--panel);
  }
  .stepper button{
    width:34px;height:34px;
    border-radius:6px;
    border:1.5px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-size:18px;
    font-family:'IBM Plex Mono', monospace;
    cursor:pointer;
  }
  .stepper button:active{background:var(--cyan); color:#FFFFFF; border-color:var(--cyan);}
  .stepper .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:22px; font-weight:500;
  }

  .phone-input{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--panel);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--text);
  }
  .phone-input:focus{outline:none; border-color:var(--cyan);}
  .phone-input::placeholder{color:#A9A6A0;}

  footer{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:420px;
    margin:0 auto;
    background:var(--bg);
    border-top:1px solid var(--line);
    padding:14px 20px 18px;
  }
  .rate-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--text-soft);
    margin:0 0 10px;
    text-align:center;
  }
  .err-note{
    font-size:12.5px;
    color:var(--err);
    margin:0 0 10px;
    text-align:center;
    display:none;
  }
  .err-note.show{display:block;}
  .send-btn{
    width:100%;
    padding:16px;
    background:var(--magenta);
    color:#fff;
    border:none;
    border-radius:8px;
    font-family:'Archivo Black', sans-serif;
    font-size:14px;
    letter-spacing:0.4px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .send-btn:active{background:#c30074;}
  .send-btn:disabled{background:var(--panel-2); color:#A9A6A0; cursor:not-allowed;}
  .send-btn.sending{
    background:var(--panel-2);
    color:var(--text-soft);
    cursor:progress;
  }

  .overlay{
    position:absolute; inset:0;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 30px;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:20;
  }
  .overlay.show{opacity:1; pointer-events:all;}
  .stamp-wrap{
    border:3px solid var(--cyan);
    border-radius:10px;
    color:var(--cyan);
    padding:18px 26px;
    transform:rotate(-6deg) scale(0.6);
    opacity:0;
    margin-bottom:26px;
  }
  .overlay.show .stamp-wrap{
    animation:stampdown .45s cubic-bezier(.36,1.4,.4,1) .15s forwards;
  }
  @keyframes stampdown{
    0%{transform:rotate(-6deg) scale(2.2); opacity:0;}
    60%{transform:rotate(-6deg) scale(0.92); opacity:1;}
    100%{transform:rotate(-6deg) scale(1); opacity:1;}
  }
  .stamp-wrap h2{
    font-family:'Archivo Black', sans-serif;
    font-size:20px;
    margin:0 0 4px;
    letter-spacing:1px;
    color:var(--text);
  }
  .stamp-wrap p{
    margin:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:1px;
  }
  .overlay-detail{font-size:14px; color:var(--text-soft); line-height:1.6; max-width:280px;}
  .overlay-detail b{color:var(--text);}
  .close-overlay{
    margin-top:26px;
    background:none;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:10px 22px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    color:var(--text);
  }

  /* ===== header: language toggle ===== */
  .head-right{display:flex; align-items:center; gap:12px;}
  .lang-toggle{
    border:1.5px solid var(--text); background:transparent; border-radius:999px;
    font-family:'Work Sans','Hind Vadodara',sans-serif; font-weight:600; font-size:12.5px;
    padding:6px 12px; cursor:pointer; color:var(--text); white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .lang-toggle:hover{background:var(--text); color:#fff;}
  .lang-toggle:focus-visible, .pv-viewport:focus-visible, .pv-zoom button:focus-visible{outline:3px solid var(--cyan); outline-offset:2px;}

  /* ===== Gujarati typography ===== */
  body[data-lang="gu"]{font-family:'Hind Vadodara','Work Sans',sans-serif;}
  body[data-lang="gu"] .send-btn,
  body[data-lang="gu"] .stamp-wrap h2{font-family:'Hind Vadodara','Archivo Black',sans-serif; font-weight:700; letter-spacing:0;}
  body[data-lang="gu"] .brand-mark p,
  body[data-lang="gu"] .ticket-no,
  body[data-lang="gu"] .step-label,
  body[data-lang="gu"] .rate-note,
  body[data-lang="gu"] .stamp-wrap p{font-family:'Hind Vadodara','IBM Plex Mono',sans-serif; letter-spacing:0; text-transform:none;}
  body[data-lang="gu"] .step-label{font-size:13px; font-weight:600;}
  body[data-lang="gu"] .send-btn{font-size:15px;}

  /* ===== file preview with zoom ===== */
  .preview{padding:10px;}
  .pv-wrap{position:relative;}
  .pv-viewport{
    position:relative; width:100%; height:min(58vh, 440px); min-height:260px;
    overflow:hidden; background:var(--panel-2); border-radius:8px;
    touch-action:pan-y; cursor:grab; user-select:none; -webkit-user-select:none; outline:none;
  }
  .pv-viewport.dragging{cursor:grabbing;}
  .pv-stage{position:absolute; left:0; top:0; transform-origin:0 0; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .preview .pv-stage canvas{
    position:absolute; left:0; top:0; width:100%; height:100%; margin:0; max-width:none;
    border:none; border-radius:0; display:block; pointer-events:none;
  }
  .pv-zoom{
    position:absolute; left:50%; bottom:8px; transform:translateX(-50%); z-index:3;
    display:flex; align-items:center; gap:2px; padding:3px;
    background:rgba(22,21,19,.84); border-radius:999px;
  }
  .pv-zoom button{
    min-width:32px; height:32px; border:none; border-radius:999px; background:transparent;
    color:#fff; font-size:17px; cursor:pointer; padding:0 6px; font-family:'IBM Plex Mono', monospace;
  }
  .pv-zoom button.txt{font-size:12px; padding:0 10px; font-family:'Work Sans','Hind Vadodara',sans-serif;}
  .pv-zoom button:active{background:rgba(255,255,255,.22);}
  .pv-zoom span{min-width:46px; text-align:center; color:#fff; font-size:12px; font-family:'IBM Plex Mono', monospace;}
  .pv-bar span{text-align:center; line-height:1.35;}
  .pv-hint{font-size:11px; color:var(--text-soft); text-align:center; margin:8px 0 0; line-height:1.5;}

  /* ===== price box (footer) + price on the success screen ===== */
  .app{padding-bottom:158px;}
  .price-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin:0 0 10px; padding:8px 14px;
    background:var(--panel); border:1.5px solid var(--line); border-radius:8px;
  }
  .price-info{display:flex; flex-direction:column; min-width:0; gap:1px;}
  .price-label{font-size:11px; font-weight:600; color:var(--text-soft); text-transform:uppercase; letter-spacing:.6px;}
  .price-break{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-soft); line-height:1.4;}
  .price-amt{font-family:'Archivo Black', sans-serif; font-size:28px; line-height:1; color:#A9A6A0; white-space:nowrap;}
  .price-bar.has-price{border-color:var(--magenta); background:#FFF5FA;}
  .price-bar.has-price .price-amt{color:var(--magenta);}
  body[data-lang="gu"] .price-label{text-transform:none; letter-spacing:0; font-family:'Hind Vadodara','Work Sans',sans-serif; font-size:12.5px;}
  body[data-lang="gu"] .price-break{font-family:'Hind Vadodara','IBM Plex Mono',sans-serif; font-size:12px;}
  .overlay-price{text-align:center; margin:0 0 20px;}
  .overlay-price .op-label{display:block; font-size:12.5px; color:var(--text-soft); margin-bottom:2px;}
  .overlay-price b{display:block; font-family:'Archivo Black', sans-serif; font-size:40px; line-height:1.15; color:var(--magenta);}
  .overlay-price small{display:block; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-soft); margin-top:2px;}
  body[data-lang="gu"] .overlay-price small{font-family:'Hind Vadodara','IBM Plex Mono',sans-serif;}

  /* ===== "order received" screen: always fills the visible window (not the whole long page) ===== */
  .overlay{
    position:fixed; top:0; bottom:0; left:0; right:0; max-width:420px; margin:0 auto;
    justify-content:flex-start; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:28px 30px;
  }
  .overlay > :first-child{margin-top:auto;}
  .overlay > :last-child{margin-bottom:auto;}
  .overlay .stamp-wrap{flex-shrink:0;}

  /* the fixed footer (price + Send) must always sit above the preview's floating zoom bar */
  footer{z-index:10;}


  /* ===== photo editor ("make it print-friendly") ===== */
  .edit-photos{
    display:none; width:100%; margin-top:8px; padding:11px; background:#fff; color:var(--magenta);
    border:1.5px solid var(--magenta); border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer;

  }

    background:#fff; max-width:420px; min-height:100%; margin:0 auto; padding:14px 16px 0; position:relative;

  .ed-x{width:36px; height:36px; border:1.5px solid var(--line); border-radius:50%; background:var(--panel); font-size:15px; cursor:pointer; color:var(--text); flex-shrink:0;}
  .ed-stage{position:relative; background:var(--panel-2); border-radius:8px; padding:12px; display:flex; justify-content:center; align-items:center; min-height:200px;}
  #edCanvas{display:block; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.28); max-width:100%;}
  .ed-compare{
    position:absolute; right:8px; bottom:8px; padding:7px 11px; border:none; border-radius:999px;
    background:rgba(22,21,19,.84); color:#fff; font-size:11.5px; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none;
    font-family:'Work Sans','Hind Vadodara',sans-serif;

  body[data-lang="gu"] .ed-compare{font-family:'Hind Vadodara',sans-serif; font-size:12px;}
  .ed-note{font-size:11.5px; color:var(--text-soft); margin:8px 0 10px; text-align:center; line-height:1.5;}

  .ed-thumbs .thx{position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; background:var(--text); color:#fff; font-size:10px; line-height:20px; text-align:center;}
  .ed-label{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.6px; margin:4px 0 8px;}
  body[data-lang="gu"] .ed-label{font-family:'Hind Vadodara',sans-serif; text-transform:none; letter-spacing:0; font-size:13px; font-weight:600;}
  .ed-chips{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .chip{
    border:1.5px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); padding:10px 8px; font-size:13px; font-weight:500;
    cursor:pointer; text-align:center; font-family:inherit; line-height:1.25;
  }
  .chip.sm{padding:9px 4px; font-size:13px;}
  .chip.active{background:var(--text); color:#fff; border-color:var(--text);}
  .ed-hint{font-size:12px; color:var(--text-soft); margin:8px 0 12px; line-height:1.5; min-height:18px;}
  .ed-sl{margin-bottom:10px;}
  .ed-sl label{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-soft); margin-bottom:4px;}
  .ed-sl label b{color:var(--text); font-weight:600;}
  .ed-sl input[type=range]{width:100%; accent-color:var(--magenta);}
  .ed-row{display:grid; grid-template-columns:44px 44px 1fr 1fr; gap:8px; margin:12px 0 6px;}
  .ed-row2{display:flex; justify-content:space-between; gap:10px; margin:6px 0 0;}
  .link-btn{background:none; border:none; color:var(--magenta); font-weight:600; font-size:13px; cursor:pointer; padding:8px 2px; font-family:inherit;}
  .ed-err{color:var(--err); font-size:12.5px; margin:6px 0 0; min-height:0; text-align:center;}
  .ed-actions{position:sticky; bottom:0; background:#fff; padding:10px 0 16px; margin-top:8px; border-top:1px solid var(--line);}
  .ed-root.busy .ed-card{cursor:progress;}
  .ed-root.busy .send-btn{background:var(--panel-2); color:var(--text-soft);}


  /* ===== rupee sign: always use the bundled glyph (see @font-face at the top) ===== */
  body{font-family:'SX Rupee','Work Sans',sans-serif;}

<body data-lang="gu">
<div class="app">

      view.drop = { main:{raw:fileLike.name}, sub:{fileInfoLive:true}, cls:'file-name' };
      renderDrop();

    var g = pageGeom(img.width, img.height);
    var box = Math.max(140, E.stage.clientWidth - 24), maxH = Math.max(240, Math.min(window.innerHeight*0.5, 520));
    var cssW = Math.min(box, 340), cssH = cssW*g.ph/g.pw;
    if(cssH > maxH){ cssH = maxH; cssW = cssH*g.pw/g.ph; }
    var dpr = Math.min(window.devicePixelRatio || 1, 2), page = composePage(img, s.fit, cssW*dpr/g.pw);
    E.canvas.width = page.width; E.canvas.height = page.height;
    E.canvas.style.width = Math.round(cssW) + 'px'; E.canvas.style.height = Math.round(cssH) + 'px';
    E.canvas.getContext('2d').drawImage(page, 0, 0);
    E.canvas.setAttribute('data-orient', g.pw > g.ph ? 'landscape' : 'portrait');
  }

  /* ---- controls ---- */
  function edSync(){
    var it = curItem(); if(!it) return; var s = it.settings, items = ed.sess.items, i;
    E.root.querySelectorAll('[data-mode]').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-mode') === s.mode); });
    E.root.querySelectorAll('[data-fit]').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-fit') === s.fit); });
    E.bri.value = s.bri; E.briV.textContent = s.bri; E.con.value = s.con; E.conV.textContent = s.con; E.sharp.value = s.sharp; E.sharpV.textContent = s.sharp;
    E.hint.textContent = t('h_' + s.mode) + (it.auto ? ' · ' + t('edAuto') : '');
    E.count.textContent = items.length > 1 ? t('edCount', { n:ed.cur + 1, total:items.length }) : '';
    E.all.style.display = items.length > 1 ? '' : 'none';
    if(!ed.building) E.done.textContent = t('edDone', { pages:pagesText(items.length) });
    E.thumbs.style.display = items.length > 1 ? 'flex' : 'none';
    E.thumbs.innerHTML = '';
    for(i = 0; i < items.length; i++){
      (function(idx){
        var b = document.createElement('button'); b.type = 'button'; b.className = 'th' + (idx === ed.cur ? ' active' : '');
        var c = document.createElement('canvas'); c.width = 52; c.height = 68; var cg = c.getContext('2d');
        cg.fillStyle = '#EBEBE7'; cg.fillRect(0, 0, 52, 68);
        var w = items[idx].work, k = Math.min(52/w.width, 68/w.height);
        cg.drawImage(w, (52 - w.width*k)/2, (68 - w.height*k)/2, w.width*k, w.height*k);
        b.appendChild(c);
        var x = document.createElement('span'); x.className = 'thx'; x.textContent = '✕'; x.setAttribute('aria-label', 'Remove');
        x.addEventListener('click', function(ev){ ev.stopPropagation(); removePhoto(idx); });
        b.appendChild(x);
        b.addEventListener('click', function(){ ed.cur = idx; edSync(); edQueue(); });
        E.thumbs.appendChild(b);
      })(i);
    }
  }
  function removePhoto(idx){
    if(ed.building) return;
    ed.sess.items.splice(idx, 1);
    if(!ed.sess.items.length){ closeEditor(false); return; }
    ed.cur = Math.min(ed.cur, ed.sess.items.length - 1);
    edSync(); edQueue();
  }
  E.root.querySelectorAll('[data-mode]').forEach(function(b){
    b.addEventListener('click', function(){ var it = curItem(); if(!it || ed.building) return; it.settings.mode = b.getAttribute('data-mode'); it.auto = false; edSync(); edQueue(); });
  });
  E.root.querySelectorAll('[data-fit]').forEach(function(b){
    b.addEventListener('click', function(){ var it = curItem(); if(!it || ed.building) return; it.settings.fit = b.getAttribute('data-fit'); edSync(); edQueue(); });
  });
  function bindSlider(el, label, key){
    el.addEventListener('input', function(){ var it = curItem(); if(!it) return; it.settings[key] = +el.value; label.textContent = el.value; edQueue(); });
  }
  bindSlider(E.bri, E.briV, 'bri'); bindSlider(E.con, E.conV, 'con'); bindSlider(E.sharp, E.sharpV, 'sharp');
  E.rotL.addEventListener('click', function(){ var it = curItem(); if(!it || ed.building) return; it.settings.rot = (it.settings.rot + 270) % 360; edQueue(); });
  E.rotR.addEventListener('click', function(){ var it = curItem(); if(!it || ed.building) return; it.settings.rot = (it.settings.rot + 90) % 360; edQueue(); });
  function cmpOn(e){ e.preventDefault(); ed.compare = true; edRender(); }
  function cmpOff(){ if(ed.compare){ ed.compare = false; edRender(); } }
  E.cmp.addEventListener('pointerdown', cmpOn); E.cmp.addEventListener('pointerup', cmpOff);
  E.cmp.addEventListener('pointerleave', cmpOff); E.cmp.addEventListener('pointercancel', cmpOff);
  E.all.addEventListener('click', function(){
    var it = curItem(); if(!it || ed.building) return;
    ed.sess.items.forEach(function(o){ var r = o.settings.rot; o.settings = cloneSettings(it.settings); o.settings.rot = r; o.auto = false; });
    edSync(); edQueue();
  });
  E.add.addEventListener('click', function(){ if(!ed.building) E.addInput.click(); });
  E.addInput.addEventListener('change', function(){
    var files = Array.prototype.slice.call(E.addInput.files || []).filter(isImg); E.addInput.value = '';
    if(!files.length || ed.building) return;
    if(ed.sess.items.length + files.length > MAX_PAGES){ E.err.textContent = t('tooManyPhotos', { max:MAX_PAGES }); return; }
    E.err.textContent = '';
    loadPhotos(files).then(function(items){
      var first = ed.sess.items.length; ed.sess.items = ed.sess.items.concat(items); ed.cur = first; edSync(); edQueue();
    }).catch(function(e){ E.err.textContent = t(e && e.key ? e.key : 'imgBad', e && e.params); });
  });
  E.close.addEventListener('click', function(){ if(!ed.building) closeEditor(false); });
  window.addEventListener('keydown', function(e){ if(e.key === 'Escape' && E.root.classList.contains('show') && !ed.building) closeEditor(false); });
  editBtn.addEventListener('click', function(){
    if(!ed.committed) return;
    ed.sess = { items:ed.committed.items.map(cloneItem) }; ed.cur = 0; openEditor(false);
  });
  window.addEventListener('resize', function(){ if(E.root.classList.contains('show')) edQueue(); });

  /* ---- build the PDF: every photo is decoded at full size ONE AT A TIME, edited, laid out on A4 and added ---- */
  function jpegBuffer(canvas, q){
    return new Promise(function(res, rej){
      canvas.toBlob(function(blob){
        if(!blob){ rej(new Error('jpeg')); return; }
        if(blob.arrayBuffer){ blob.arrayBuffer().then(res, rej); return; }
        var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = rej; fr.readAsArrayBuffer(blob);
      }, 'image/jpeg', q);
    });
  }
  function buildPdf(items, attempt, progress){
    return PDFLib.PDFDocument.create().then(function(pdf){
      var i = 0;
      function step(){
        if(i >= items.length) return pdf.save();
        progress(i + 1, items.length);
        var it = items[i];
        return decodeFile(it.file).then(function(bmp){
          var src = toCanvas(bmp, IMG_OUT), proc = processCanvas(src, it.settings), g = pageGeom(proc.width, proc.height);
          var dispW = it.settings.fit === 'fill' ? Math.max(g.pw, g.ph*proc.width/proc.height) : Math.min(g.pw - 2*MARGIN_PT, (g.ph - 2*MARGIN_PT)*proc.width/proc.height);
          var ppp = Math.min(attempt.ppp, Math.max(150/72, proc.width/dispW));
          var page = composePage(proc, it.settings.fit, ppp);
          return jpegBuffer(page, attempt.q).then(function(ab){ return pdf.embedJpg(ab); }).then(function(jpg){
            pdf.addPage([g.pw, g.ph]).drawImage(jpg, { x:0, y:0, width:g.pw, height:g.ph });
            i++; return step();
          });
        }, function(){ throw new Error('decode'); });
      }
      return step();
    });
  }
  function buildWithLimit(items, progress){
    var a = 0;
    function attempt(){
      return buildPdf(items, ATTEMPTS[a], progress).then(function(bytes){
        if(bytes.length <= MAX_MB*1024*1024) return bytes;
        a++; if(a >= ATTEMPTS.length) throw new Error('tooBigOut');
        return attempt();
      });
    }
    return attempt();
  }
  function setBusy(b){
    ed.building = b; E.root.classList.toggle('busy', b);
    E.root.querySelectorAll('button, input').forEach(function(el){ el.disabled = b; });
  }
  E.done.addEventListener('click', function(){
    if(ed.building || !ed.sess) return;
    var items = ed.sess.items;
    setBusy(true); E.err.textContent = '';
    buildWithLimit(items, function(n, total){ E.done.textContent = t('preparing', { n:n, total:total }); })
    .then(function(bytes){
      var buf = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
      var name = items.length === 1 ? items[0].name.replace(/\.[^.]+$/, '') + '.pdf' : 'photos.pdf';
      return acceptPdf({ name:name, size:bytes.length, fromPhotos:true }, buf, items.length);
    })
    .then(function(){ ed.committed = ed.sess; setBusy(false); closeEditor(true); })
    .catch(function(err){
      setBusy(false);
      E.err.textContent = (err && err.message === 'tooBigOut') ? t('tooBigOut') : t('buildFail');
      edSync();
    });
  });

  /* ============================================================
     PAGE RANGE
     ============================================================ */
  function parsePageRange(text, total){
    text = text.trim();
    if(!text) return { all:true };
    var parts = text.split(','), set = [], seen = {};
    for(var i = 0; i < parts.length; i++){
      var p = parts[i].trim(); if(!p) continue;
      var mm = p.match(/^(\d+)\s*-\s*(\d+)$/), a, b;
      if(mm){ a = +mm[1]; b = +mm[2]; }
      else if(/^\d+$/.test(p)){ a = b = +p; }
      else return { err:{key:'badRange'} };
      if(a < 1 || b > total || a > b) return { err:{key:'rangeBounds', params:{n:total}} };
      for(var n = a; n <= b; n++){ if(!seen[n]){ seen[n] = 1; set.push(n); } }
    }
    if(!set.length) return { all:true };
    return { pages:set };
  }

  function updateRange(){
    rangeBox.style.display = state.pagemode === 'select' ? 'block' : 'none';

    if(!state.origBuf){
      state.rangeOk = false; setHint({key:'uploadFirst'}, false); checkReady(); updatePvLabel(); return;
    }

    if(state.pagemode === 'all'){
      state.selection = 'all'; state.pages = state.totalPages;
      if(state.totalPages > MAX_PAGES){
        state.rangeOk = false;
        setHint({key:'tooManyAll', params:{n:state.totalPages, max:MAX_PAGES}}, true);
      } else {
        state.rangeOk = true;
        setHint(state.totalPages === 1 ? {key:'printOne'} : {key:'printAll', params:{n:state.totalPages}}, false);
      }
      checkReady(); updatePvLabel(); return;
    }

    if(!rangeInput.value.trim()){
      state.rangeOk = false; setHint({key:'typePages'}, false); checkReady(); updatePvLabel(); return;
    }
    var res = parsePageRange(rangeInput.value, state.totalPages);
    if(res.err){
      state.rangeOk = false; setHint(res.err, true);
    } else if(res.all){
      state.rangeOk = false; setHint({key:'typePages'}, false);
    } else if(res.pages.length > MAX_PAGES){
      state.rangeOk = false; setHint({key:'tooManySel', params:{n:res.pages.length, max:MAX_PAGES}}, true);
    } else {
      state.selection = res.pages; state.pages = res.pages.length; state.rangeOk = true;
      setHint({key:'printSome', params:{n:res.pages.length, total:state.totalPages}}, false);
    }
    checkReady(); updatePvLabel();
  }
  rangeInput.addEventListener('input', updateRange);

  // builds a PDF with ONLY the chosen pages (so what is stored is exactly what gets printed)
  function buildFinalB64(){
    if(state.selection === 'all') return Promise.resolve(state.fileB64All);
    var indices = state.selection.map(function(n){ return n - 1; });
    return PDFLib.PDFDocument.load(state.origBuf).then(function(src){
      return PDFLib.PDFDocument.create().then(function(out){
        return out.copyPages(src, indices).then(function(copied){
          for(var i = 0; i < copied.length; i++){ out.addPage(copied[i]); }
          return out.save();
        });
      });
    }).then(function(bytes){
      var bin = '', chunk = 0x8000;
      for(var i = 0; i < bytes.length; i += chunk){ bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk)); }
      return btoa(bin);
    });
  }

  /* ============================================================
     OPTIONS + READY STATE + TOTAL
     ============================================================ */
  document.querySelectorAll('.choice').forEach(function(el){
    el.addEventListener('click', function(){
      var group = el.getAttribute('data-group');
      document.querySelectorAll('.choice[data-group="'+group+'"]').forEach(function(sib){ sib.classList.remove('active'); });
      el.classList.add('active');
      state[group] = el.getAttribute('data-val');
      if(group === 'pagemode') updateRange();
      checkReady();
    });
  });
  $('plus').addEventListener('click', function(){
    if(state.copies < 30){ state.copies++; copyCount.textContent = state.copies; checkReady(); }
  });
  $('minus').addEventListener('click', function(){
    if(state.copies > 1){ state.copies--; copyCount.textContent = state.copies; checkReady(); }
  });
  phoneInput.addEventListener('input', function(){
    phoneInput.value = phoneInput.value.replace(/\D/g,'').slice(0,10);
    state.phone = phoneInput.value;
    checkReady();
  });

  // price of what is currently chosen (null until a valid file + page selection exists)
  function currentPrice(){
    if(!(state.fileB64All && state.rangeOk && state.pages >= 1)) return null;
    var rate = state.color === 'color' ? RATE_COLOR : RATE_BW;
    return { rate:rate, pages:state.pages, copies:state.copies, total:state.pages * rate * state.copies };
  }
  function calcText(o){
    return t('calcLine', { pages:pagesText(o.pages), rate:o.rate, copies:o.copies > 1 ? ' × ' + t('nCopies', {n:o.copies}) : '' });
  }
  function renderOverlayPrice(){
    var o = view.order;
    $('overlayAmt').textContent = o ? '₹' + o.total : '';
    $('overlayBreak').textContent = o ? calcText(o) : '';
  }

  function checkReady(){
    var ready = state.fileB64All && state.rangeOk && state.pages >= 1 && state.phone.length === 10 && !sending;
    sendBtn.disabled = !ready;
    var pr = currentPrice();
    if(pr){
      priceAmt.textContent = '₹' + pr.total;
      priceBreak.textContent = calcText(pr) + ' · ' + t('payAtPickup');
      priceBar.classList.add('has-price');
    } else {
      priceAmt.textContent = '₹—';
      priceBreak.textContent = t('priceIdle');
      priceBar.classList.remove('has-price');
    }
  }

  /* ============================================================
     SEND THE ORDER  (same as before)
     ============================================================ */
  sendBtn.addEventListener('click', function(){
    if(sending) return;
    clearError();
    if(BACKEND_URL.indexOf('script.google.com') === -1){ showError({key:'noBackend'}); return; }

    var sentPrice = currentPrice();
    sending = true;
    sendBtn.classList.add('sending');
    sendBtn.textContent = t('sending');
    sendBtn.disabled = true;

    buildFinalB64()
    .then(function(finalB64){
      var payload = {
        fileName: state.file.name,
        fileData: finalB64,
        pages: state.pages,
        color: state.color,
        side: state.side,
        copies: state.copies,
        phone: state.phone
      };
      return fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
    })
    .then(function(res){ return res.json(); })
    .then(function(out){
      if(out && out.ok && out.token){
        view.token = out.token;
        view.order = sentPrice;
        renderOverlayPrice();
        $('tokenNo').textContent = '#' + out.token;
        $('overlayToken').textContent = t('tokenWord') + ' #' + out.token;
        $('overlay').classList.add('show');
      } else {
        var k = out && out.error ? SERVER_ERR[out.error] : null;
        showError(k ? {key:k} : (out && out.error && lang === 'en' ? {raw:out.error} : {key:'orderFailed'}));
      }
    })
    .catch(function(){ showError({key:'noConn'}); })
    .finally(function(){
      sending = false;
      sendBtn.classList.remove('sending');
      sendBtn.textContent = t('send');
      checkReady();
    });
  });

  $('closeOverlay').addEventListener('click', function(){
    state = { file:null, origBuf:null, fileB64All:null, totalPages:0, pagemode:'all', selection:'all', rangeOk:false, pages:0, color:'bw', side:'single', copies:1, phone:'' };
    fileInput.value = '';
    hidePreview();
    rangeInput.value = ''; rangeBox.style.display = 'none';
    fileInfo = null; ed.committed = null; ed.sess = null; updateEditBtn();
    view.drop = { main:{key:'tapChoose'}, sub:{key:'fileTypes'}, cls:'' }; renderDrop();
    setHint({key:'uploadFirst'}, false);
    dropZone.classList.remove('has-file','bad-file');
    copyCount.textContent = '1';
    phoneInput.value = '';
    document.querySelectorAll('.choice').forEach(function(el){ el.classList.remove('active'); });
    document.querySelector('.choice[data-val="all"]').classList.add('active');
    document.querySelector('.choice[data-val="bw"]').classList.add('active');
    document.querySelector('.choice[data-val="single"]').classList.add('active');
    view.token = null; view.order = null; renderOverlayPrice();
    $('tokenNo').textContent = '#—';
    clearError();
    checkReady();
    updatePvLabel();
    $('overlay').classList.remove('show');
  });

  /* ============================================================
     START — remembered language, else Gujarati
     ============================================================ */
  var saved = null;
  try{ saved = localStorage.getItem(LS_KEY); }catch(e){}
  applyLang(saved === 'en' ? 'en' : 'gu');
})();
</script>
</body>
