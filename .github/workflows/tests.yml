name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"          # Mondays 03:17 UTC — catches library / browser changes even when nobody pushes

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Fonts used by the tests (Liberation has no ₹ — that is the point of one test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: tests
      - name: Run every test suite
        run: python tests/run_all.py
      - name: Save screenshots / artifacts of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: tests/.artifacts
          if-no-files-found: ignore
